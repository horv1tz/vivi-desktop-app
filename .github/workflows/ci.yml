name: CI

on:
  push:
    branches: ['**']
  pull_request:
  # DIST-03: lets build.yml call this workflow as a release gate (a tag push runs the same
  # lint/typecheck/test/build/verify-dist checks as any branch push, before anything is released).
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, typecheck, unit and e2e (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install system libraries for Electron
        if: runner.os == 'Linux'
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb libnss3 libgtk-3-0 libgbm1 libasound2t64 libatk-bridge2.0-0 libxss1 libxtst6
      - run: npm ci
      # SEC-07: surfaces known-vulnerable dependencies for a human to triage. Non-blocking
      # (continue-on-error) because build-tooling transitives (e.g. node-gyp's own tar dependency,
      # pulled in only to compile native modules during install, never shipped or run in the app)
      # can carry a high-severity advisory with no fix published yet; npm ci itself already rejects
      # a package.json/package-lock.json that are out of sync.
      - name: Audit dependencies
        shell: bash
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      # tests/unit/tools/browser-real.test.ts spawns a real, non-headless Chromium when one is
      # discoverable on PATH (true for ubuntu-latest's own image) and needs somewhere to render
      # into — without a display it hangs and times out instead of skipping. macOS/Windows Chrome
      # doesn't need an X server, so only Linux needs the same xvfb wrapper the e2e step below uses.
      - name: Unit tests (xvfb)
        if: runner.os == 'Linux'
        shell: bash
        run: xvfb-run -a --server-args="-screen 0 1280x800x24" npm test
      - name: Unit tests
        if: runner.os != 'Linux'
        run: npm test
      - run: npm run build
      - name: Electron smoke tests (xvfb)
        if: runner.os == 'Linux'
        shell: bash
        run: xvfb-run -a --server-args="-screen 0 1280x800x24" npx playwright test tests/e2e/smoke.spec.ts
      - name: Electron smoke tests
        if: runner.os != 'Linux'
        run: npx playwright test tests/e2e/smoke.spec.ts
      - name: Package (dir) and verify Claude binary + native modules (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          npx electron-builder --linux dir --publish never
          node scripts/verify-dist.mjs
      - name: Package (dir) and verify Claude binary + native modules (Windows)
        if: runner.os == 'Windows'
        shell: bash
        # verify-dist.mjs's cross-platform dist-folder detection is not yet confirmed for Windows;
        # don't block the matrix on it while that's validated (see CI workflow notes).
        continue-on-error: true
        run: |
          npx electron-builder --win dir --publish never
          node scripts/verify-dist.mjs
      - name: Package (dir) and verify Claude binary + native modules (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          npx electron-builder --mac dir --publish never
          node scripts/verify-dist.mjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results-${{ matrix.os }}
          path: test-results
          if-no-files-found: ignore
