name: Build installers

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Create the GitHub release v<package.json version> at this commit and upload the installers'
        type: boolean
        default: false

# GITHUB_TOKEN needs write access to create the GitHub Release (and its tag) and upload installers.
permissions:
  contents: write

jobs:
  # DIST-03: gates the release on the same lint/typecheck/test/build/verify-dist checks that run
  # on every branch push - a red CI run must never produce a tagged release or published installer.
  test:
    name: Run CI checks
    uses: ./.github/workflows/ci.yml

  release:
    name: GitHub release
    needs: [test]
    # A tag push or an explicit "publish" dispatch creates the release up front; the build jobs then
    # upload their installers into it (electron-builder finds it by tag).
    if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.create.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Create release if missing
        id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "$TAG" ]]; then
            echo "pushed tag $GITHUB_REF_NAME does not match package.json version $VERSION" >&2
            exit 1
          fi
          # DIST-03: a version with a SemVer pre-release tag (0.2.0-beta.1, -rc.1, …) publishes as a
          # GitHub pre-release; electron-builder's GitHub provider already reads that same tag to
          # generate beta*.yml instead of latest*.yml, so update channels follow automatically.
          PRERELEASE_FLAG=()
          if [[ "$VERSION" == *-* ]]; then
            PRERELEASE_FLAG=(--prerelease)
            echo "$VERSION has a pre-release tag; publishing as a GitHub pre-release"
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $TAG already exists"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "Vivi $VERSION" --notes-file .github/release-notes.md "${PRERELEASE_FLAG[@]}"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Vivi $VERSION" --notes-file .github/release-notes.md "${PRERELEASE_FLAG[@]}"
          fi

  build:
    name: ${{ matrix.os }}
    needs: [test, release]
    if: ${{ !cancelled() && needs.test.result == 'success' && (needs.release.result == 'success' || needs.release.result == 'skipped') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: --linux
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Unsigned builds unless signing secrets are configured (see the step below).
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Code signing / notarization are opt-in via repository secrets. electron-builder treats an
      # empty CSC_LINK as a certificate path, so the variables are only exported when actually set.
      - name: Configure code signing (optional)
        shell: bash
        env:
          CSC_LINK_SECRET: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD_SECRET: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID_SECRET: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD_SECRET: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID_SECRET: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$CSC_LINK_SECRET" ]; then
            echo "CSC_LINK=$CSC_LINK_SECRET" >> "$GITHUB_ENV"
            echo "CSC_KEY_PASSWORD=$CSC_KEY_PASSWORD_SECRET" >> "$GITHUB_ENV"
            echo "CSC_IDENTITY_AUTO_DISCOVERY=true" >> "$GITHUB_ENV"
            echo "code signing enabled"
          else
            echo "no signing certificate configured; building unsigned"
          fi
          if [ -n "$APPLE_ID_SECRET" ]; then
            echo "APPLE_ID=$APPLE_ID_SECRET" >> "$GITHUB_ENV"
            echo "APPLE_APP_SPECIFIC_PASSWORD=$APPLE_APP_SPECIFIC_PASSWORD_SECRET" >> "$GITHUB_ENV"
            echo "APPLE_TEAM_ID=$APPLE_TEAM_ID_SECRET" >> "$GITHUB_ENV"
          fi
      - name: Package
        env:
          # Allow uploading into a release created earlier than two hours ago (re-runs).
          EP_GH_IGNORE_TIME: 'true'
        run: npx electron-builder ${{ matrix.target }} --publish ${{ needs.release.result == 'success' && 'always' || 'never' }}
      # SEC-07: lets a user verify a downloaded installer wasn't tampered with in transit or on a mirror.
      - name: Generate checksums
        shell: bash
        run: node scripts/checksums.mjs dist checksums-${{ matrix.os }}.txt
      - name: Upload checksums to release
        if: needs.release.result == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ needs.release.outputs.tag }} dist/checksums-${{ matrix.os }}.txt --repo ${{ github.repository }} --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: vivi-${{ matrix.os }}
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/latest*.yml
            dist/checksums-*.txt
          if-no-files-found: warn
